[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  included_files = ["agent knowladge.txt"]

[functions."blog-draft-schedule"]
  node_bundler = "esbuild"
  # Mon/Wed/Fri, 14:30 PKT; retry once at 16:30 PKT. Same slot prevents duplicates.
  schedule = "30 9,11 * * 1,3,5"

[functions."blog-draft-background"]
  node_bundler = "esbuild"

[functions."blog-cloud-status"]
  node_bundler = "esbuild"

[functions."clickup-reviews-background"]
  node_bundler = "esbuild"

[functions."clickup-reviews-schedule"]
  node_bundler = "esbuild"
  # Approval checks only: this does not generate extra articles.
  schedule = "7,37 * * * *"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/slack/commands"
  to = "/.netlify/functions/slack-commands"
  status = 200

[[redirects]]
  from = "/api/slack/interactions"
  to = "/.netlify/functions/slack-interactions"
  status = 200

[[redirects]]
  from = "/api/blog/report"
  to = "/.netlify/functions/blog-report"
  status = 200

[[redirects]]
  from = "/api/blog/approve"
  to = "/.netlify/functions/blog-approve"
  status = 200

[[redirects]]
  from = "/api/blog/improve"
  to = "/.netlify/functions/blog-improve"
  status = 200

[[redirects]]
  from = "/api/blog/run"
  to = "/.netlify/functions/blog-run"
  status = 200

[[redirects]]
  from = "/api/blog/status"
  to = "/.netlify/functions/blog-status"
  status = 200

[[redirects]]
  from = "/api/blog/system-report"
  to = "/.netlify/functions/blog-system-report"
  status = 200

[[redirects]]
  from = "/api/notion/webhook"
  to = "/.netlify/functions/notion-webhook"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
